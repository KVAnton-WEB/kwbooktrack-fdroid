org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# Unified Test Platform тянет дополнительные артефакты из сети — без них
# `connectedDebugAndroidTest` не запускается офлайн. Старый runner AndroidJUnitRunner
# достаточно: он ставит тестовый APK на устройство сам.
android.experimental.androidTest.useUnifiedTestPlatform=false
kotlin.code.style=official

activityCompose = "1.9.2"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.6"
hilt = "2.52"
hiltCompiler = "1.2.0"
room = "2.6.1"
coroutines = "1.8.1"
junit = "4.13.2"
robolectric = "4.13"
truth = "1.4.4"
commonsCsv = "1.11.0"
zxing = "4.3.0"
paging = "3.3.2"

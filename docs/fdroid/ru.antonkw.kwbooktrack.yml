# F-Droid собирает из отдельного репозитория: main — это та ветка, которую
# fdroidserver клонирует по умолчанию, а в основном репозитории main живёт
# своей жизнью и содержит свои версии. Тег v*-fdroid ставится только здесь.
RepoType: git
Repo: https://github.com/KVAnton-WEB/kwbooktrack-fdroid.git

Builds:
  - versionName: 0.9.5-fdroid
    versionCode: 114
    commit: __COMMIT__
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+(-fdroid)?$
CurrentVersion: 0.9.5-fdroid
CurrentVersionCode: 114

MaintainerNotes: |-
  This builds from the mirror repository kwbooktrack-fdroid, whose main branch
  is the F-Droid release branch of kvbooktrack. Upstream development happens in
  KVAnton-WEB/kwbooktrack; the mirror is updated by pushing that branch to main
  and pushing the v*-fdroid tag together with it.

  Descriptions, changelogs and screenshots live in the app repository under
  fastlane/metadata/android/{en-US,ru}; do not duplicate them here.

  The release build type is signed with a local keystore when
  keystore.properties exists. fdroidserver strips the signingConfigs block and
  the signingConfig assignment, so the build server produces an unsigned APK
  and signs it with the F-Droid key. Verified locally by applying the same
  stripping: output is app-release-unsigned.apk.

  The app has no INTERNET permission and no network dependencies; all data is
  stored locally in Room.
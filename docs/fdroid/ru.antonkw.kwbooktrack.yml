MaintainerNotes: |-
  This builds from kwbooktrack-fdroid, whose main branch is the F-Droid
  release branch. The upstream development repository is private, so
  SourceCode/IssueTracker/Changelog intentionally point at this public mirror;
  the full history with tags is there. The mirror is updated by pushing the
  release branch to main together with the v*-fdroid* tag.

  Descriptions, changelogs and screenshots live in the app repository under
  fastlane/metadata/android/{en-US,ru}; do not duplicate them here.

  The release build type is signed with the debug key, but fdroidserver strips
  the signingConfigs block and the signingConfig assignment, so the build
  server produces an unsigned APK and signs it with the F-Droid key. Verified
  with a local `fdroid build --test` against this repository: the APK is
  unsigned, versionName 0.9.5-fdroid.2, versionCode 115.

  The app has no INTERNET permission and no network dependencies; all data is
  stored locally in Room.

